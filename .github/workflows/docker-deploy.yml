name: Deploy Techmax Web

on:
  push:
    branches:
      - main

jobs:
    Build:
      runs-on: aws-runner
      steps:
        - uses: actions/checkout@v7

        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
            
        - name: Build techmax Image
          run: docker build . --file Dockerfile --tag kniru/techmax-c2:latest

        - name: Push Image to DockerHub
          run: docker push kniru/techmax-c2:latest

